<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181214"/>
      <stop offset="50%" stop-color="#0f090b"/>
      <stop offset="100%" stop-color="#070405"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb984"/>
      <stop offset="100%" stop-color="#c9a675"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(201, 166, 117, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(201, 166, 117, 0.2)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Center Decorative Glow -->
  <circle cx="400" cy="270" r="90" fill="rgba(201, 166, 117, 0.04)"/>

  <!-- Center Icon (Image Placeholder) -->
  <g transform="translate(360, 230)">
    <rect x="0" y="0" width="80" height="64" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="26" cy="24" r="7" fill="url(#goldGrad)"/>
    <path d="M 6 52 L 28 32 L 44 46 L 56 36 L 74 52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="400" y="340" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#dfb984">GÖRSEL ALANI</text>
  <text x="400" y="365" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" letter-spacing="1.5" fill="#7a6e65">800 × 600 // PLACEHOLDER</text>
</svg>
